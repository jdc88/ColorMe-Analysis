<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ColorMe</title>
  <link rel="stylesheet" href="Dash.css">
  <link rel="stylesheet" href="dashAnim.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/images/color-wheel-guide-isolated-on-transparent-vector-48630416.webp">
  <style>

    .dashboard-header {
        margin-bottom: 3rem;
        text-align: center;
    }

    .dashboard-header h1 {
        font-size: 2.5rem;
        color: #333;
        margin-bottom: 0.5rem;
    }

    .dashboard-header h2 {
        font-size: 1.5rem;
        color: #666;
        font-weight: normal;
    }

    .action-container {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        margin-bottom: 40px;
    }

    .action-box {
        background-color: white;
        width: 300px;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        text-decoration: none;
        color: inherit;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid #eee;
        cursor: pointer;
    }

    .action-box:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        border-color: #a1c4fd;
    }

    .icon-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: white;
        margin-bottom: 20px;
    }

    .action-box h3 {
        margin: 0 0 10px 0;
        font-size: 1.4rem;
        font-weight: 600;
        color: #333;
    }

    .action-box p {
        margin: 0;
        color: #888;
        font-size: 1rem;
        line-height: 1.5;
        text-align: center;
    }

    .results-container {
        margin-top: 20px;
        padding: 20px;
        max-width: 1000px;
        margin-left: auto;
        margin-right: auto;
    }
    
    .result-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: left;
    }

    .card-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
        border-top: 1px solid #eee;
        padding-top: 15px;
    }

    .action-btn {
        padding: 8px 15px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: all 0.3s ease;
        border: none;
    }

    .btn-export {background-color: #eef2ff; color: #667eea; }
    .btn-export:hover { background-color: #dce4ff; }

    .btn-view { background-color: #f0fdf4; color: #22c55e; }
    .btn-view:hover { background-color: #dcfce7; }

    .btn-delete { background-color: #fff1f2; color: #f43f5e; }
    .btn-delete:hover { background-color: #ffe4e6; }

    .no-results {
        text-align: center;
        padding: 40px;
        color: #666;
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 30px;
      border-radius: 20px;
      width: 80%;
      max-width: 600px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      position: relative;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close:hover, .close:focus {
      color: #333;
      text-decoration: none;
      cursor: pointer;
    }

    .color-swatch-row { 
      display: flex; 
      gap: 15px; 
      justify-content: center; 
      margin: 20px 0; 
    }

    .color-swatch { text-align: center; }

    .color-circle { 
      width: 50px; 
      height: 50px; 
      border-radius: 50%; 
      border: 3px solid #eee; 
      margin: 0 auto 5px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }

    .palette-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); 
      gap: 10px; margin-top: 15px; 
    }

    .palette-item { 
      width: 100%; 
      padding-bottom: 100%; 
      border-radius: 8px; 
      border: 1px solid rgba(0,0,0,0.1); 
    }
    
    .modal-section { 
      margin-bottom: 25px; 
      border-bottom: 1px solid #eee; 
      padding-bottom: 15px; 
    }

    .modal-section:last-child { border-bottom: none; }

    .modal-section h3 { 
      color: #667eea; 
      margin-bottom: 10px; 
      font-size: 1.2rem; 
    }
  </style>
</head>

<body class="sb-decor BG-image">
  <aside class="sidebar">
    <nav>
      <ul>
        <li>
          <a href="#" class="active">
            <i class="bx bx-home-circle"></i>
            <span>Dashboard</span>
          </a>
        </li>
        
        <li>
          <a href="settings.html">
            <i class="bx bx-cog"></i>
            <span>Settings</span>
          </a>
        </li>
        <li>
          <a href="#" id="logout-link">
            <i class="bx bx-log-out"></i>
            <span>Log out</span>
          </a>
        </li>
        <li>
          <a href="#" data-resize-btn>
            <i class="bx bx-chevrons-right"></i>
            <span>Collapse</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main>
    <div class="dashboard-header">
        <h1>ColorMe Dashboard</h1>
        <h2 id="welcome-message">Welcome back!</h2>
    </div>

    <div class="action-container">
        <a href="index.html" class="action-box">
            <div class="icon-circle" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <i class="bx bx-plus"></i>
            </div>
            <h3>Start New Report</h3>
            <p>Upload a new photo to analyze your seasonal colors.</p>
        </a>
        <div class="action-box" onclick="scrollToResults()">
            <div class="icon-circle" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <i class="bx bx-history"></i>
            </div>
            <h3>View Saved Reports</h3>
            <p>Look back at your previous color analysis history.</p>
        </div>
    </div>

    <div id="loading" style="display: none; text-align: center; margin: 20px;">
        <p>Loading your results...</p>
    </div>
    <div id="results-container" class="results-container"></div>
  </main>

  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modal-title" style="text-align: center; margin-bottom: 20px">Analysis Details</h2>
      <div id="modal-body">
          </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = "http://127.0.0.1:5001";
    let currentResults = [];

    // Sidebar functionality
    const resizeBtn = document.querySelector('[data-resize-btn]');
    resizeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      document.body.classList.toggle('sb-decor');
    });

    // Logout functionality
    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      sessionStorage.removeItem('loggedInUser');
      localStorage.removeItem('username');
      window.location.href = '/';
    });

    // Page Load Logic
    window.addEventListener('DOMContentLoaded', () => {
      const loggedInUser = sessionStorage.getItem('loggedInUser');
      const username = localStorage.getItem('username');

      if (!loggedInUser && !username) {
        window.location.href = '/Login page.html';
        return;
      }

      const welcomeMessage = document.getElementById('welcome-message');
      welcomeMessage.textContent = `Welcome back, ${username || loggedInUser}!`;

      loadUserResults();
    });

    function scrollToResults() {
        const container = document.getElementById('results-container');
        container.scrollIntoView({ behavior: 'smooth' });
    }

    async function loadUserResults() {
      const loading = document.getElementById('loading');
      const resultsContainer = document.getElementById('results-container');
      const username = localStorage.getItem('username') || sessionStorage.getItem('loggedInUser');

      loading.style.display = 'block';
      resultsContainer.innerHTML = '';

      try {
        const response = await fetch(`${BACKEND_URL}/user/results`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username })
        });

        const data = await response.json();
        loading.style.display = 'none';

        if (response.ok && data.results && data.results.length > 0) {
          currentResults = data.results.reverse();
          displayResults(data.results);
        } else {
          displayNoResults();
        }

      } catch (error) {
        console.error('Error loading results:', error);
        loading.style.display = 'none';
        displayNoResults();
      }
    }

    function displayResults(results) {
      const container = document.getElementById('results-container');
      container.innerHTML = `<h2 style="text-align: center; color: #333; margin-bottom: 30px;">Color Analysis History</h2>`;

      // Show newest first
      results.forEach((result, index) => {
        const date = new Date(result.timestamp).toLocaleDateString();
        const time = new Date(result.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const card = document.createElement('div');
        card.className = 'result-card';
        
        let colorHtml = '';
        if(result.colors) {
            colorHtml = `
            <div style="display: flex; gap: 20px; margin-top: 15px; align-items: center;">
                <div style="text-align: center;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background:${result.colors.skin}; border: 2px solid #eee; margin: 0 auto;"></div>
                    <p style="font-size: 12px; margin-top: 5px; color: #666;">Skin</p>
                </div>
                <div style="text-align: center;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background:${result.colors.hair}; border: 2px solid #eee; margin: 0 auto;"></div>
                    <p style="font-size: 12px; margin-top: 5px; color: #666;">Hair</p>
                </div>
                <div style="text-align: center;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background:${result.colors.eyes}; border: 2px solid #eee; margin: 0 auto;"></div>
                    <p style="font-size: 12px; margin-top: 5px; color: #666;">Eyes</p>
                </div>
            </div>`;
        }

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #333;">${result.season} Season</h3>
            <span style="color: #888; font-size: 0.9rem;">${date}</span>
          </div>
          <p><strong>Undertone:</strong> ${result.undertone}</p>
          <p style="color: #666;">${result.message}</p>
          ${colorHtml}
          
          <div class="card-actions">
            <button class="action-btn btn-export" onclick="exportResult(${index})">
                <i class='bx bx-export'></i> Export
            </button>
            <button class="action-btn btn-view" onclick="openDetailsModal(${index})">
                <i class='bx bx-show'></i> View Details
            </button>
            <button class="action-btn btn-delete" onclick="deleteResult('${result.timestamp}')">
                <i class='bx bx-trash'></i> Delete
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function displayNoResults() {
      document.getElementById('results-container').innerHTML = `
        <div class="no-results">
          <i class="bx bx-palette" style="font-size: 48px; color: #ddd; margin-bottom: 15px;"></i>
          <h3>No Saved Reports Yet</h3>
          <p>Your analysis history will appear here once you start.</p>
        </div>
      `;
    }

    function exportResult(index) {
      const result = currentResults[index];
      if(!result) return;

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(result, null, 2));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", `ColorMe_${result.season}_${new Date(result.timestamp).toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    }

    async function deleteResult(timestamp) {
      if(!confirm("Are you sure you want to delete this report? This cannot be undone.")) return;

      const username = localStorage.getItem('username') || sessionStorage.getItem('loggedInUser');

      try {
        const response = await fetch(`${BACKEND_URL}/user/delete-result`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, timestamp: timestamp })
        });

        if(response.ok) {
          loadUserResults();
        } else {
          alert("Failed to delete result. Please try again.");
        }
      } catch (error) {
        console.error("Delete failed", error);
        alert("An error occurred while deleting.");
      }
    }

    function openDetailsModal(index) {
      const result = currentResults[index];
      if (!result) return;

      const modal = document.getElementById('detailsModal');
      const body = document.getElementById('modal-body');
      const title = document.getElementById('modal-title');

      title.textContent = `${result.season} Season Analysis`;

      const characteristics = result.season_info?.characteristics || "No description available.";
      const jewelry = result.undertone_info?.jewelry || "No jewelry tips available.";
      const metals = result.season_info?.metals || "N/A";

      const bestColors = result.season_info?.best_colors || [];

      let skinColor = result.colors?.skin || (result.skin_rgb ? `rgb(${result.skin_rgb})`  : '#eee');
      let hairColor = result.colors?.hair || (result.hair_rgb ? `rgb(${result.hair_rgb})`  : '#eee');
      let eyeColor = result.colors?.eyes || (result.eye_rgb ? `rgb(${result.eye_rgb})`  : '#eee');

      // Creates HTML that's recommended for the user's palette
      let paletteHtml = '';
      if(result.recommended_palette && Array.isArray(result.recommended_palette)) {
        paletteHtml = `<div class="palette-grid">
          ${result.recommended_palette.map(color =>
            `<div class="palette-item" style="background-color: ${color};" title="${color}"></div>`
          ).join('')}
        </div>`;
      } else {
          paletteHtml = '<p style="color:#888;">No recommended palette generated for this report.</p>';
      }

      const bestColorsHtml = bestColors.length > 0
          ? `<p>${bestColors.join(', ')}</p>`
          : '<p>No specific colors listed.</p>';

      body.innerHTML = `
          <div class="modal-section">
              <h3>Your Features</h3>
              <div class="color-swatch-row">
                  <div class="color-swatch">
                      <div class="color-circle" style="background-color: ${skinColor}"></div>
                      <small>Skin</small>
                  </div>
                  <div class="color-swatch">
                      <div class="color-circle" style="background-color: ${hairColor}"></div>
                      <small>Hair</small>
                  </div>
                  <div class="color-swatch">
                      <div class="color-circle" style="background-color: ${eyeColor}"></div>
                      <small>Eyes</small>
                  </div>
              </div>
          </div>

          <div class="modal-section">
              <h3>Seasonal Characteristics</h3>
              <p>${characteristics}</p>
          </div>

          <div class="modal-section">
              <h3>Best Colors to Wear</h3>
              ${bestColorsHtml}
          </div>

          <div class="modal-section">
            <h3>Style & Jewelry</h3>
            <p><strong>Jewelry:</strong> ${jewelry}</p>
            <p><strong>Metals:</strong> ${metals}</p>
          </div>

          <div class="modal-section">
            <h3>Recommended Color Palette</h3>
            ${paletteHtml}
          </div>
      `;

      modal.style.display = "block";
  }

  function closeModal() {
    document.getElementById('detailsModal').style.display = "none";
  }

  window.onclick = function(event) {
    const modal = document.getElementById('detailsModal');
    if (event.target == modal) {
      modal.style.display = "none";
    }
  }
  </script>
</body>
</html>
