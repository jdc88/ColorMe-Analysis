<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/images/color-wheel-guide-isolated-on-transparent-vector-48630416.webp">
    <title>Sign up — ColorMe</title>
</head>
<body class="center-login">
    <div class="page-bg" aria-hidden="true"></div>

    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="auth-subtitle">Save your seasonal palette and access your analysis history anytime.</p>

        <div id="pending-results-display" class="pending-results">
            <h4>Your analysis will be saved</h4>
            <p id="pending-season"></p>
            <p id="pending-undertone"></p>
        </div>

        <div id="success-message" class="success-message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3" autocomplete="username">
                <div id="username-error" class="field-error">Username must be at least 3 characters</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                <div id="email-error" class="field-error">Please enter a valid email</div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6" autocomplete="new-password">
                <div id="password-error" class="field-error">Password must be at least 6 characters</div>
            </div>
            <button type="submit" id="signup-btn">Create account</button>
        </form>

        <div class="links-container">
            <div class="link-item">
                <p>Already have an account?</p>
                <a href="Login page.html" class="login-link">Log in</a>
            </div>
            <div class="link-item">
                <a href="index.html" class="home-link">Back to home</a>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "";

        window.addEventListener('DOMContentLoaded', () => {
            const pendingResults = sessionStorage.getItem('pendingResults');
            if (pendingResults) {
                try { displayPendingResults(JSON.parse(pendingResults)); } catch (e) { console.error(e); }
            }
        });

        function displayPendingResults(results) {
            document.getElementById('pending-results-display').style.display = 'block';
            document.getElementById('pending-season').textContent = `Season: ${results.season}`;
            document.getElementById('pending-undertone').textContent = `Undertone: ${results.undertone}`;
        }

        function validateForm() {
            let isValid = true;
            const username = document.getElementById('username').value;
            if (username.length < 3) {
                document.getElementById('username-error').style.display = 'block';
                isValid = false;
            } else document.getElementById('username-error').style.display = 'none';

            const email = document.getElementById('email').value;
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('email-error').style.display = 'block';
                isValid = false;
            } else document.getElementById('email-error').style.display = 'none';

            const password = document.getElementById('password').value;
            if (password.length < 6) {
                document.getElementById('password-error').style.display = 'block';
                isValid = false;
            } else document.getElementById('password-error').style.display = 'none';

            return isValid;
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!validateForm()) return;

            const signupBtn = document.getElementById('signup-btn');
            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating account…';

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            let analysisResults = null;
            const pendingResults = sessionStorage.getItem('pendingResults');
            if (pendingResults) {
                try { analysisResults = JSON.parse(pendingResults); } catch (e) { console.error(e); }
            }

            try {
                const response = await fetch(`${BACKEND_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, analysis_results: analysisResults })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userId', data.user_id);
                    localStorage.setItem('username', data.username);
                    sessionStorage.setItem('loggedInUser', data.username);
                    sessionStorage.removeItem('pendingResults');

                    const successMsg = document.getElementById('success-message');
                    successMsg.textContent = 'Account created! Redirecting…';
                    successMsg.style.display = 'block';
                    setTimeout(() => { window.location.href = '/Dashboard.html'; }, 2000);
                } else {
                    alert('Signup failed: ' + (data.error || data.message || 'Unknown error'));
                    signupBtn.disabled = false;
                    signupBtn.textContent = 'Create account';
                }
            } catch (error) {
                console.error(error);
                alert('Network error. Please check if the backend server is running.');
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create account';
            }
        });

        document.getElementById('username').addEventListener('input', () => {
            if (document.getElementById('username').value.length >= 3)
                document.getElementById('username-error').style.display = 'none';
        });
        document.getElementById('email').addEventListener('input', () => {
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('email').value))
                document.getElementById('email-error').style.display = 'none';
        });
        document.getElementById('password').addEventListener('input', () => {
            if (document.getElementById('password').value.length >= 6)
                document.getElementById('password-error').style.display = 'none';
        });
    </script>
</body>
</html>
