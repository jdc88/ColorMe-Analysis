<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/images/color-wheel-guide-isolated-on-transparent-vector-48630416.webp">
    <title>Settings — ColorMe</title>
</head>
<body class="center-login">
    <div class="page-bg" aria-hidden="true"></div>

    <div class="auth-card">
        <h1>Settings</h1>
        <p class="auth-subtitle">Manage your account and password.</p>

        <div class="user-info-box">
            <p><strong>Username:</strong> <span id="username-display">Loading…</span></p>
            <p><strong>Email:</strong> <span id="email-display">Loading…</span></p>
        </div>

        <form id="password-form">
            <div class="settings-section">
                <h3>Change password</h3>
                <div class="form-group">
                    <label for="old-password">Current password</label>
                    <input type="password" id="old-password" name="oldPassword" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" name="newPassword" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required autocomplete="new-password">
                </div>
                <button type="submit">Update password</button>
            </div>
        </form>

        <p id="settings-message" style="margin-top: 1rem; text-align: center; font-weight: 600; min-height: 1.25rem;"></p>

        <div class="links-container" style="border-top: none; padding-top: 0;">
            <a href="Dashboard.html" class="home-link">Back to dashboard</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loggedInUser = sessionStorage.getItem('loggedInUser');
            const msgBox = document.getElementById('settings-message');

            if (!loggedInUser) {
                window.location.href = '/Login page.html';
                return;
            }

            fetch('/get-user-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: loggedInUser })
            })
            .then(response => response.json())
            .then(data => {
                if (data.username) {
                    document.getElementById('username-display').textContent = data.username;
                    document.getElementById('email-display').textContent = data.email;
                } else {
                    document.getElementById('username-display').textContent = loggedInUser;
                    document.getElementById('email-display').textContent = 'Unable to load';
                }
            });

            document.getElementById('password-form').addEventListener('submit', async (e) => {
                e.preventDefault();

                const oldPassword = document.getElementById('old-password').value;
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                msgBox.style.color = 'var(--color-text-muted)';
                msgBox.textContent = 'Updating…';

                if (newPassword !== confirmPassword) {
                    msgBox.style.color = '#c44';
                    msgBox.textContent = 'New passwords do not match.';
                    return;
                }

                try {
                    const response = await fetch('/update-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: loggedInUser, oldPassword, newPassword })
                    });
                    const result = await response.json();

                    if (result.success) {
                        msgBox.style.color = '#4a8a5e';
                        msgBox.textContent = 'Password updated successfully.';
                        document.getElementById('password-form').reset();
                    } else {
                        msgBox.style.color = '#c44';
                        msgBox.textContent = result.message || 'Failed to update password.';
                    }
                } catch (error) {
                    console.error(error);
                    msgBox.style.color = '#c44';
                    msgBox.textContent = 'A server error occurred.';
                }
            });
        });
    </script>
</body>
</html>
