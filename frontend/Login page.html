<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/images/color-wheel-guide-isolated-on-transparent-vector-48630416.webp">
    <title>Log in — ColorMe</title>
</head>
<body class="center-login">
    <div class="page-bg" aria-hidden="true"></div>

    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to save your color analysis and view your dashboard.</p>

        <div id="pending-results-display" class="pending-results">
            <h4>Your analysis will be saved</h4>
            <p id="pending-season"></p>
            <p id="pending-undertone"></p>
        </div>

        <div id="success-message" class="success-message"></div>
        <div id="error-message" class="error-message" style="display: none;">
            <p>Incorrect username or password.</p>
        </div>

        <form id="loginForm">
            <div class="sec-pg-login-container">
                <div class="form-group">
                    <input type="text" id="fname" name="username" placeholder="Username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="lname" name="password" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn">Log in</button>
            </div>

            <div class="links-container">
                <div class="link-item">
                    <p>Don't have an account?</p>
                    <a href="signup.html" class="signup-link">Sign up</a>
                </div>
                <div class="link-item">
                    <a href="index.html" class="home-link">Back to home</a>
                </div>
            </div>
        </form>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:5001";

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);

            if (params.has('error')) {
                document.getElementById('error-message').style.display = 'block';
            }

            const pendingResults = sessionStorage.getItem('pendingResults');
            if (pendingResults) {
                try {
                    displayPendingResults(JSON.parse(pendingResults));
                } catch (error) {
                    console.error('Error parsing pending results:', error);
                }
            }
        });

        function displayPendingResults(results) {
            document.getElementById('pending-results-display').style.display = 'block';
            document.getElementById('pending-season').textContent = `Season: ${results.season}`;
            document.getElementById('pending-undertone').textContent = `Undertone: ${results.undertone}`;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginBtn = document.getElementById('login-btn');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');

            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in…';

            const username = document.getElementById('fname').value;
            const password = document.getElementById('lname').value;

            const pendingResults = sessionStorage.getItem('pendingResults');
            let analysisResults = null;
            if (pendingResults) {
                try { analysisResults = JSON.parse(pendingResults); } catch (error) { console.error(error); }
            }

            try {
                const response = await fetch(`${BACKEND_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, analysis_results: analysisResults })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('authToken', data.token || 'temp_token');
                    localStorage.setItem('userId', data.user_id || username);
                    localStorage.setItem('username', data.username || username);
                    sessionStorage.setItem('loggedInUser', username);
                    sessionStorage.removeItem('pendingResults');

                    successMessage.textContent = 'Login successful! Redirecting…';
                    successMessage.style.display = 'block';
                    setTimeout(() => { window.location.href = '/Dashboard.html'; }, 1500);
                } else {
                    errorMessage.querySelector('p').textContent = data.message || 'Incorrect username or password.';
                    errorMessage.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Log in';
                }
            } catch (error) {
                console.error('Error during login:', error);
                errorMessage.querySelector('p').textContent = 'Network error. Is the server running?';
                errorMessage.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Log in';
            }
        });
    </script>
</body>
</html>
